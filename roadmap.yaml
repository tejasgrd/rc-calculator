# RC Calc roadmap: machine- and human-readable plan for upcoming work.
# Status values: done | next | planned | idea.  Effort: S (< 1 session), M (1–2), L (3+).

project:
  name: RC Calc (calculator, designer, build templates, flight simulator)
  runs: offline from disk (file://), classic scripts, no build step
  vendor: assets/vendor/three.bundle.min.js (three@0.186.1 + GLTF/OBJ/STL loaders, GLTFExporter, MIT)
  tests:
    unit: node tests/run-tests.mjs
    pages: node tests/browser-smoke.mjs /tmp/rc-smoke
    simulator: node tests/sim-smoke.mjs /tmp/rc-sim-smoke

done:
  - id: weather-v1
    summary: Weather presets (calm, breeze, windy, gusty, stormy, thermal day) + advanced wind, gusts, turbulence, thermals, sky.
    files: ["assets/rc-sim-physics.js (Environment, WEATHER_PRESETS)", "assets/simulator.js", "simulator.html", "assets/rc-sim-world.js (setWeather)"]
  - id: air-density
    summary: Density from temperature, field elevation and QNH; used by aero, thrust tables, trim and test predictions.
    files: ["assets/rc-sim-physics.js (airDensity, densityAltitude)", "assets/rc-sim-model.js (thrTableAt, opts.rho)"]
  - id: surfaces-from-design
    summary: Control-surface chord %, span ranges, flaps and throws are design data (geom.surfaces) used by diagram, 3D, templates and simulator.
    files: ["assets/rc-core.js (SURFACE_DEFAULTS, surfaceSpec)", "assets/rc-diagram.js", "assets/rc-3d.js", "assets/rc-templates.js", "assets/rc-sim-model.js", "designer.html"]
  - id: as-built
    summary: Measured weight and balance point (design.measured) applied via asBuilt() to Designer analyses and the simulator; simulator CG override.
    files: ["assets/rc-aero.js (asBuilt, cgToRootLE)", "assets/designer.js", "assets/simulator.js"]
  - id: flight-log-calibration
    summary: >
      Import EdgeTX/OpenTX CSV, INAV/Betaflight blackbox CSV, ArduPilot text logs, GPX/IGC or manual measurements; auto-detect
      glide/climb/cruise/top-speed/stall/roll segments (wind from turns, energy-corrected climb, battery SoC from voltage); fit
      cd0/clmax/thrust/current/roll factors with bounds and honest confidence; before/after charts; play the log in 3D.
    files: ["assets/rc-sim-calib.js (SimCalib)", "assets/simulator.js (Calibrate tab)", "assets/designer.js (Flight logs card)", "tests/fixtures/"]
    verified: synthetic logs recover all five factors within ±5 % (airspeed) and cd0 within 10 % (GPS only)
    open_questions:
      - Which logger/radio will be used first (EdgeTX with GPS + current sensor is the easiest)?
      - ArduPilot binary .bin parser (text/CSV export works today).
  - id: instructor-and-lessons
    summary: >
      Buddy-box instructor (student switch on SPACE / Xbox LB / a mapped transmitter switch, auto take-over at limits, shared
      control), 20 lessons in 5 groups incl. crosswind, dead-stick, figure-eight, orientation drill, hand-launch, thermal,
      loop/roll/stall turn/inverted and failure drills (motor cut, stuck aileron, radio failsafe, low battery); scoring with
      stars and history (rcSim.progress.v1), coaching tips, "Show me" demo pilot, ideal-path ribbon and stick-hint dots.
    files: ["assets/rc-sim-lessons.js (SimLessons: DEFS, Lesson, DemoPilot, Instructor)", "assets/simulator.js", "assets/rc-sim-input.js (student switch)"]
    verified: every lesson completed by the demo pilot; auto take-over recovers from 90° bank / 45° dive at 22 m (unit tests)
  - id: tree-turbulence
    summary: Wind deficit + small-scale turbulence in the wake of each tree (up to 12 tree heights downwind, below 1.8 × height).
    files: ["assets/rc-sim-physics.js (Environment.wakeAt, obstacles)", "assets/rc-sim-world.js (obstacles)"]
  - id: import-improvements
    summary: OBJ + .mtl colours/textures, multi-file glTF (.bin/textures selected together), licence/author/source from glTF asset extras or licence.txt, kept in .rcsim packages and shown as credits.
    files: ["assets/rc-sim-import.js (parseMTL, metaFrom, readFiles, credit)", "assets/simulator.js (import wizard)"]
  - id: scenario-share
    summary: "Share link simulator.html#scenario=… with plane (full design), weather, air, start, assist, instructor, CG, throws and lesson; nothing uploaded."
    files: ["assets/simulator.js (makeScenario, applyScenario)"]
  - id: perf-settings
    summary: Graphics presets (low → ultra) with shadow quality, draw distance and resolution scale; low-FPS hint.
    files: ["assets/rc-sim-world.js (setGraphics)", "assets/simulator.js"]
  - id: designer-density
    summary: Field temperature and elevation in Designer step 6; density feeds sizing, performance, operating point and motor matching.
    files: ["assets/rc-core.js (airDensity, densityAltitude)", "assets/designer.js", "designer.html"]
  - id: motor-mount
    summary: >
      Down/right-thrust angles and prop rotation as design data; simulator physics for thrust tilt, torque reaction,
      spiral slipstream on the fin and P-factor (switchable in the simulator); suggested mount angles from the same physics
      (static moment balance refined by hands-off full-power runs) in the Designer, calculator, Build page and simulator;
      Build page washer/spacer table and printable mount wedges; "Power response" test flight.
    files: ["assets/rc-sim-physics.js (forces, power test)", "assets/rc-sim-model.js (suggestThrustAngles, describeThrust)", "assets/designer.js", "index.html", "assets/build.js", "assets/rc-templates.js (mountShims, wedges)", "assets/rc-3d.js / rc-diagram.js (tilted motor, thrust arrows)", "assets/simulator.js"]
    verified: suggested angles cut the full-power swing by ≥ 40 % on the built-ins; trainer swings 28° left with a straight mount, 3° with the suggested one
  - id: info-tooltips
    summary: Hover/focus "i" buttons with detailed explanations for about 230 parameters on every page (shared glossary).
    files: ["assets/rc-info.js", "assets/rc-style.css"]
  - id: guide
    summary: Guide/encyclopedia page with 12 fundamentals chapters (10 interactive widgets), two live worked Depron examples (trainer, flying wing) with progress tracking and links into Designer/Build/Simulator, and a searchable A–Z glossary.
    files: ["guide.html", "assets/guide.js"]

next: []

